feature:
  id: credential-validation
  name: Credential validation

  description: >
    Explorar casos adicionales de credenciales y validaciones visibles durante el
    inicio de sesión.

  objective: >
    Confirmar el comportamiento observable ante credenciales inválidas y campos
    obligatorios, ampliando de forma incremental la cobertura de autenticación.

  scope:
    include:
      - Credenciales incorrectas
      - Username vacío
      - Password vacío
      - Mensajes de error visibles
    exclude:
      - Logout
      - Registro de usuarios
      - Cart
      - Checkout

  exploration:
    coverage:
      - negative
      - validation
      - error-handling

  automation:
    suites:
      - regression

